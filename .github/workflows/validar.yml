name: Validar dados

# Portao de qualidade: nenhum JSON quebrado entra no repositorio sem que
# o time seja avisado. Roda em todo push e em todo pull request.
on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar schemas dos JSONs
        run: python validar.py

      - name: Verificar integridade entre arquivos
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from app.repositorio import Repositorio

          problemas = Repositorio(Path(".")).verificar_integridade()
          for p in problemas:
              print(f"  {p}")
          if problemas:
              print(f"\n{len(problemas)} inconsistencia(s) encontrada(s).")
              sys.exit(1)
          print("Integridade referencial ok.")
          PY