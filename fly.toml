# fly.toml app configuration file generated for gerenciador-software on 2026-09-04T14:58:37-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gerenciador-software'
primary_region = 'gru'

[build]
[env]
  BACKUP_MINUTOS = '30'
  EM_PRODUCAO = '1'
  PORTA = '8000'
  RAIZ_DADOS = '/dados/repo'

[[mounts]]
  source = 'dados'
  destination = '/dados'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
